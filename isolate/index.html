    <meta name="theme-color" content="#0A0A0A" />
    <script>
      // Pre-paint theme: dark is the KIYUMI default; if the device prefers
      // light (or the visitor previously chose light) apply it before first
      // paint so there's no white/black flash on load.
      (function () {
        try {
          var stored = localStorage.getItem("kiyumi-theme");
          var light =
            stored === "light" ||
            (stored !== "dark" &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            document.documentElement.classList.add("light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#fafafb");
          }
        } catch (e) {}
      })();
    </script>
