<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Koyummi Admin - Add Product</title>

                        "secondary": "#fbabff",

                        "on-surface": "#e9dfeb",
                        "on-tertiary-fixed": "#2b1700",
                        "surface-dim": "#161219",
                        "inverse-primary": "#803abd",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ffddbb",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#231e26",
                        "on-primary": "#4a007f",
                        "on-secondary-fixed": "#36003e",
                        "surface-container-low": "#1f1a22",
                        "inverse-surface": "#e9dfeb",
                        "surface-container-lowest": "#110c14",
                        "on-primary-container": "#d7a8ff",
                        "secondary-container": "#ae05c6",

                        "tertiary": "#faba72",
                        "tertiary-container": "#6d4100",
                        "on-tertiary-container": "#eeaf68",
                        "surface-container-highest": "#38333c",
                        "primary": "#dfb7ff",
                        "primary-container": "#6b21a8",
                        "primary-fixed-dim": "#dfb7ff",
                        "inverse-on-surface": "#342e37",
                        "background": "#161219",
                        "tertiary-fixed-dim": "#faba72",
                        "primary-fixed": "#f1dbff",

                    "spacing": {
                        "margin-desktop": "64px",
                        "margin-mobile": "16px",

                    "fontFamily": {
                        "label-mono": ["Geist"],
                        "headline-lg-mobile": ["Anybody"],
                        "display-xl": ["Anybody"],

                    "fontSize": {

                        "headline-lg-mobile": ["32px", { "lineHeight": "38px", "fontWeight": "700" }],

                },
            },

<style>
        body {
            background-color: #161219;
            color: #e9dfeb;
        }
        
        .bg-gradient-primary {
            background: linear-gradient(135deg, #dfb7ff 0%, #6b21a8 100%);
        }
        
        .border-gradient:hover {
            border-image: linear-gradient(135deg, #dfb7ff 0%, #6b21a8 100%) 1;
        }

        .input-brutalist {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #4c4452;
            color: #e9dfeb;
            transition: border-color 0.3s ease;
            width: 100%;
            padding: 8px 0;
        }
        
        .input-brutalist:focus {
            outline: none;
            border-bottom: 2px solid #dfb7ff;
        }

        .card-brutalist {
            background-color: #1f1a22;
            border: 1px solid #333333;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #161219;
        }
        ::-webkit-scrollbar-thumb {
            background: #38333c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4c4452;
        }
    </style>
</head>
<body class="font-body-regular text-body-regular min-h-screen flex">
<!-- SideNavBar -->
<nav class="bg-surface-container dark:bg-surface-container h-screen w-64 fixed left-0 top-0 border-r border-outline-variant flex flex-col h-full py-8 z-50">
<div class="px-8 mb-12">
<h1 class="font-display-xl text-display-xl text-primary tracking-tighter" style="font-size: 40px; line-height: 40px;">KOYUMMI</h1>
<p class="font-label-mono text-label-mono text-on-surface-variant mt-2">Streetwear Admin</p>
</div>
<ul class="flex flex-col gap-2 px-4 flex-grow">
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-primary transition-all duration-200 ease-in-out font-label-mono text-label-mono" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                    Dashboard
                </a>
</li>
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-primary transition-all duration-200 ease-in-out font-label-mono text-label-mono" href="#">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
                    Orders
                </a>
</li>
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-primary bg-primary-container/10 border-r-2 border-primary font-bold font-label-mono text-label-mono transition-all duration-200 ease-in-out" href="#">
<span class="material-symbols-outlined" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
                    Products
                </a>
</li>
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-primary transition-all duration-200 ease-in-out font-label-mono text-label-mono" href="#">
<span class="material-symbols-outlined" data-icon="category">category</span>
                    Collections
                </a>
</li>
<li>
<a class="flex items-center gap-4 px-4 py-3 rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-primary transition-all duration-200 ease-in-out font-label-mono text-label-mono" href="#">
<span class="material-symbols-outlined" data-icon="layers">layers</span>
                    Inventory
                </a>
</li>
</ul>
<div class="px-8 mt-auto pt-8 border-t border-outline-variant">
<a class="flex items-center gap-4 text-on-surface-variant hover:text-primary transition-colors font-label-mono text-label-mono" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                Settings
            </a>
</div>
</nav>
<!-- TopNavBar -->
<header class="bg-surface dark:bg-surface fixed top-0 right-0 w-[calc(100%-16rem)] z-40 border-b border-outline-variant flex justify-between items-center h-16 px-margin-desktop ml-64">
<div class="flex-1">
<!-- Breadcrumbs / Title Context -->
<div class="flex items-center gap-2 text-on-surface-variant font-label-mono text-label-mono">
<span>Products</span>
<span class="material-symbols-outlined" style="font-size: 16px;">chevron_right</span>
<span class="text-on-surface">Add New</span>
</div>
</div>
<div class="flex items-center gap-6">
<button class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="dark_mode">dark_mode</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors cursor-pointer active:opacity-80">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
<button class="bg-gradient-primary text-background font-label-mono text-label-mono px-6 py-2 rounded-none uppercase hover:opacity-90 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined text-sm">save</span>
                Save Product
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="ml-64 mt-16 p-margin-desktop w-full max-w-[1600px] mx-auto flex flex-col md:flex-row gap-gutter">
<!-- Left Column: Primary Details (2/3 width) -->
<div class="flex-grow flex flex-col gap-12 lg:w-2/3">
<!-- Section: Product Information -->
<section class="card-brutalist p-8">
<h2 class="font-subheading text-subheading text-primary mb-8 flex items-center gap-3 border-b border-outline-variant pb-4">
<span class="material-symbols-outlined">description</span>
                    Basic Information
                </h2>
<div class="flex flex-col gap-8">
<div>
<label class="font-label-mono text-label-mono text-on-surface-variant mb-2 block uppercase">Product Title</label>
<input class="input-brutalist font-subheading text-subheading" placeholder="e.g. Neon Horizon Hoodie" type="text"/>
</div>
<div>
<label class="font-label-mono text-label-mono text-on-surface-variant mb-2 block uppercase">Subtitle / Tagline</label>
<input class="input-brutalist" placeholder="e.g. Heavyweight Cyberpunk Essential" type="text"/>
</div>
<div>
<label class="font-label-mono text-label-mono text-on-surface-variant mb-2 block uppercase">Description</label>
<textarea class="w-full bg-surface-dim border border-outline-variant text-on-surface p-4 mt-2 focus:border-primary focus:outline-none transition-colors min-h-[160px] font-body-regular text-body-regular resize-y" placeholder="Enter full product description..."></textarea>
</div>
</div>
</section>
</div>
<!-- Right Column: Metadata Sidebar (1/3 width) -->
<aside class="w-full lg:w-1/3 flex flex-col gap-12">
<!-- Section: Organization -->
<section class="card-brutalist p-8">
<h2 class="font-subheading text-subheading text-primary mb-6 flex items-center gap-3 border-b border-outline-variant pb-4">
<span class="material-symbols-outlined">category</span>
                    Organization
                </h2>
<div class="flex flex-col gap-6">
<div>
<label class="font-label-mono text-label-mono text-on-surface-variant mb-2 block uppercase">Status</label>
<select class="w-full bg-surface-dim border-b-2 border-outline-variant text-on-surface py-2 focus:border-primary focus:outline-none transition-colors appearance-none cursor-pointer">
<option value="draft">Draft</option>
<option value="active">Active</option>
<option value="archived">Archived</option>
</select>
</div>
<div>
<label class="font-label-mono text-label-mono text-on-surface-variant mb-2 block uppercase">Product Category</label>
<input class="input-brutalist" placeholder="e.g. Outerwear" type="text"/>
</div>
<div>
<label class="font-label-mono text-label-mono text-on-surface-variant mb-2 block uppercase">Tags</label>
<input class="input-brutalist" placeholder="Enter tags separated by commas" type="text"/>
<div class="flex flex-wrap gap-2 mt-4">
<!-- Tag Chips Example -->
<span class="bg-surface-dim px-3 py-1 font-label-mono text-label-mono text-on-surface border border-outline-variant flex items-center gap-2">
                                Cyberpunk <button class="hover:text-error"><span class="material-symbols-outlined" style="font-size: 14px;">close</span></button>
</span>
<span class="bg-surface-dim px-3 py-1 font-label-mono text-label-mono text-on-surface border border-outline-variant flex items-center gap-2">
                                SS24 <button class="hover:text-error"><span class="material-symbols-outlined" style="font-size: 14px;">close</span></button>
</span>
</div>
</div>
</div>
</section>
</aside>
</main>
</body></html>
